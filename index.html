<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#8F1D2C">
<title>アミューズメントパーク『楽(がく)』</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  html, body { margin: 0; height: 100%; background: #F8F4EF; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  /* 読み込み中の表示 */
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #8F1D2C; background: #F8F4EF; transition: opacity .4s; }
  #boot b { font-family: "Hiragino Mincho ProN", serif; font-size: 34px; letter-spacing: .1em; }
  #boot small { font-family: "Hiragino Mincho ProN", serif; font-size: 12px; letter-spacing: .4em; margin-top: -8px; }
  #boot i { width: 34px; height: 34px; border: 3px solid #E8DDD4; border-top-color: #8F1D2C; border-radius: 50%; animation: sp .9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  /* 席QRの読み取り画面 */
  #scan { position: fixed; inset: 0; z-index: 10; background: #000; display: none; }
  #scan.on { display: block; }
  #scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #scan .frame { position: absolute; left: 50%; top: 45%; width: 64vmin; height: 64vmin; transform: translate(-50%, -50%); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); border: 2px solid #B89A62; }
  #scan .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: rgba(184, 154, 98, .9); animation: ln 2s ease-in-out infinite; }
  @keyframes ln { 0%, 100% { top: 12%; } 50% { top: 88%; } }
  #scan .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); text-align: center; color: #FFFCF8; }
  #scan p { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
  #scan button { width: 100%; max-width: 420px; min-height: 52px; border-radius: 999px; border: 1px solid #FFFCF8; background: transparent; color: #FFFCF8; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<div id="boot"><b>楽</b><small>GAKU</small><i></i></div>
<!-- 本体(Google Apps Script)をこの中に表示する。こうするとGoogleの注意書きの帯が出ない -->
<iframe id="app" title="アミューズメントパーク『楽(がく)』" allow="clipboard-write"></iframe>
<div id="scan"><video playsinline muted></video><div class="frame"></div>
  <div class="bar"><p>椅子のQRコードを枠の中に写してください</p><button type="button" id="close">やめる</button></div></div>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwMVG8rTCvM_w_CvD6HL5RxuKZI_JyIVLvf9tlTk7pI922vHbC8DjkvZx4lmv5VewC94A/exec';
  var app = document.getElementById('app');
  var q = new URLSearchParams(location.search);
  // このスマホで登録したお客さんを覚えておく(入口のQRをもう一度読んだ時に、前回の画面を開く)
  function mem(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  if (!q.get('p') && !q.get('page') && !q.get('r') && mem('raku_p')) q.set('p', mem('raku_p'));
  q.set('embed', location.origin + location.pathname);
  app.src = EXEC + '?' + q.toString();
  // ロゴは本体の最初の画面が出るまで表示(長くても15秒で消す)
  var booted = false;
  function hideBoot() { if (booted) return; booted = true; var b = document.getElementById('boot'); b.style.opacity = 0; setTimeout(function () { b.remove(); }, 400); }
  setTimeout(hideBoot, 15000);

  // 本体の中(何段か入れ子のフレーム)すべてに知らせる
  function tell(msg, w) {
    w = w || app.contentWindow;
    try { w.postMessage(msg, '*'); } catch (e) {}
    try { for (var i = 0; i < w.frames.length; i++) tell(msg, w.frames[i]); } catch (e) {}
  }

  // ---- 席QRをカメラ映像で読み取る ----
  var scanEl = document.getElementById('scan'), video = scanEl.querySelector('video'), stream = null, timer = null;
  var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  function loadJsQR() {
    return new Promise(function (ok, ng) {
      if (window.jsQR) return ok();
      var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = ok; s.onerror = ng; document.head.appendChild(s);
    });
  }
  function stopScan() {
    scanEl.classList.remove('on'); cancelAnimationFrame(timer);
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }
  function startScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return tell({ type: 'raku-scan-fail' });
    tell({ type: 'raku-scan-open' });
    Promise.all([loadJsQR(), navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false })])
      .then(function (r) {
        stream = r[1]; video.srcObject = stream; scanEl.classList.add('on'); video.play();
        var loop = function () {
          if (!stream) return;
          if (video.readyState >= 2) {
            var w = video.videoWidth, h = video.videoHeight, k = Math.min(1, 720 / Math.max(w, h));
            canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            var d = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var code = window.jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });
            var m = code && (/[?&]seat=([A-Z]+-\d+)/.exec(code.data) || /^([A-Z]+-\d+)$/.exec(code.data));
            if (m) { try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} stopScan(); tell({ type: 'raku-seat', seat: m[1] }); return; }
          }
          timer = requestAnimationFrame(loop);
        };
        loop();
      })
      .catch(function (e) { stopScan(); tell({ type: 'raku-scan-fail', reason: e && e.name === 'NotAllowedError' ? 'denied' : '' }); });
  }
  document.getElementById('close').onclick = stopScan;

  // 本体からの知らせ
  window.addEventListener('message', function (e) {
    try {
      if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
      var d = e.data || {};
      if (d.type === 'raku-url') {
        history.replaceState(null, '', location.pathname + (d.qs ? '?' + d.qs : ''));
        var p = new URLSearchParams(d.qs || '').get('p'); if (p) mem('raku_p', p);
      }
      if (d.type === 'raku-forget') mem('raku_p', null);
      if (d.type === 'raku-ready') hideBoot();
      if (d.type === 'raku-scan') startScan();
    } catch (err) {}
  });
</script>
</body>
</html>
